name: Update Wallpapers JSON

on:
  push:
    paths:
      - 'jsons/**/*.json'
    branches:
      - dev-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-wallpapers:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Merge JSON files
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          const jsonsDir = path.join(__dirname, 'jsons');
          const wallpapersFile = path.join(__dirname, 'wallpapers.json');
          
          // Read the base wallpapers.json
          const wallpapersData = JSON.parse(fs.readFileSync(wallpapersFile, 'utf8'));
          
          // Read all JSON files from jsons directory
          const jsonFiles = fs.readdirSync(jsonsDir)
            .filter(file => file.endsWith('.json'))
            .sort();
          
          // Merge all wallpapers
          const wallpapers = [];
          for (const file of jsonFiles) {
            const filePath = path.join(jsonsDir, file);
            const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
            wallpapers.push(data);
          }
          
          // Update wallpapers array
          wallpapersData.wallpapers = wallpapers;
          
          // Write back to wallpapers.json
          fs.writeFileSync(wallpapersFile, JSON.stringify(wallpapersData, null, 2) + '\n', 'utf8');
          
          console.log(`Successfully merged ${wallpapers.length} wallpapers`);
          EOF
          
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add wallpapers.json
          git diff --staged --quiet || git commit -m "Update wallpapers.json from jsons folder"
          
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
